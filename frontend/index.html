<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6155d9">
  <meta name="typeflow-storage" content="server">
  <meta name="description" content="TypeFlow 本地打字练习室：用雅思写作和数学建模论文，练出有节奏的进步。">
  <title>TypeFlow · 打字练习室</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" type="module"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="TypeFlow 首页"><span class="brand-mark">tf<span>·</span></span><span>TypeFlow<small>你的专属打字练习室</small></span></a>
      <div class="nav-caption">WORKSPACE <span>学习空间</span></div>
      <nav id="navigation" aria-label="主导航"></nav>
      <div class="sidebar-bottom">
        <div class="daily-card"><span class="tiny-icon">✦</span><strong>每天一点，进步不止一点。</strong><p>给自己 15 分钟的专注时间。</p><div class="progress-track"><i id="daily-progress"></i></div><div class="daily-label"><span>今日练习</span><b id="daily-time">0 / 15 分钟</b></div></div>
        <button class="help-button" id="help-button"><span>ⓘ</span> 使用指南与评分规则 <span>↗</span></button>
        <div class="offline-badge"><i></i> 本地运行 · 进度自动保存</div>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb">学习空间 <span>/</span> <b id="breadcrumb">学习概览</b></div><div class="topbar-right"><span id="today-date"></span><span class="local-pill">个人空间</span><span class="avatar">我</span></div></header>
      <main id="main" tabindex="-1"><div class="loading"><span class="loader"></span>正在准备你的练习室…</div></main>
      <footer>TYPEFLOW <span>让输入更流畅，让学习有回响。</span><span>为每一次小小的进步而设计 ✦</span></footer>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
</body>
</html>
